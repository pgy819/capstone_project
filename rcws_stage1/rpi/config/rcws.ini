# RCWS Stage 1 (Step 1) runtime configuration. Design document V2.5 section in [brackets].
# Values marked [measure] must be replaced by calibration results (Sec 12.3).

[camera]                      # Sec 3.2
main_w = 1536
main_h = 864
lores_w = 640
lores_h = 360
fps = 120
force_sensor_mode = true      # request the 1536x864 binned sensor mode
sensor_w = 1536
sensor_h = 864
sensor_bit_depth = 10
exposure_search_us = 1000     # blur <= 1.7 px at 100 deg/s
exposure_track_us = 3000
gain_init = 4.0
gain_min = 1.0
gain_max = 16.0
roi_gain_control = true       # Sec 3.13.5
lens_position = 0.81          # hyperfocal ~1.23 m [measure: focus sweep, calib step 1]
timestamp_sign = 1            # +1 exposure-start, -1 readout-start [measure: LED test, calib step 3]
line_time_ns = 9629.6         # [measure: PIXEL_RATE/HBLANK, calib step 4]
buffer_count = 4

[intrinsics]                  # main-stream pixels [measure: calibrate_camera.py, calib step 2]
fx = 982
fy = 982
cx = 768
cy = 432
k1 = 0
k2 = 0
p1 = 0
p2 = 0
k3 = 0
rcb_roll = 0                  # boresight (Step 3)
rcb_pitch = 0
rcb_yaw = 0
offset_x = 0                  # optical centre offset d [m] (Step 3)
offset_y = 0
offset_z = 0

[detector]                    # Sec 3.4
hef_path = models/yolov8s_h8.hef
class_phone = 67              # COCO 'cell phone' (until the custom 2-class HEF exists)
class_person = 0              # COCO 'person'
score_min = 0.15
thr_acquire = 0.45            # COCO 'cell phone' scores are low; raise to 0.6 with the custom model
thr_track = 0.30
max_in_flight = 2
preproc_i420 = true           # v3: scale YUV planes before RGB conversion when crop > model input
linear_mild_downscale = false # v3: bilinear for 1-2x downscale (~4x faster), A/B first
lores_large_roi = true        # run 2: ROI wider than model input -> crop from lores (false: main + preproc_i420)

[roi]                         # Sec 3.5
k_s = 4
s_min = 96
s_max = 864
tile_w = 640
tile_h = 384
tiles_per_frame = 1
track_det_period_hi = 4
track_det_period_lo = 1

[ncc]                         # Sec 3.6
tmpl_min = 24
tmpl_max = 96
rho_min = 0.6
peak_margin = 0.08
update_alpha = 0.1
drift_frac = 0.3
ncc_only_max_s = 0.5

[track]                       # Sec 3.8, 3.13.2
coast_s = 0.5
reacq_s = 1.5
sprt_pd = 0.8
sprt_pfa = 0.05
gate_chi2 = 9.21
phone_height_m = 0.15
size_jump = 2.0              # v4: box size jump beyond this factor is another object (merged box, reflection)

[estimator]                   # Sec 7
q_cv = 5.0                    # hand-held motion (field run 2)
q_ca = 500.0
sigma_det_px0 = 1.5           # [measure: P3]
sigma_det_c = 0.0005

[runtime]                     # Sec 4.1
vision_cpu = 1
vision_prio = 70              # needs CAP_SYS_NICE (sudo setcap cap_sys_nice+ep rcws_vision)
logger_cpu = 0
log_path = run.rlog
clip_seconds = 0              # RAM clip of full frames for replay (~2.3 MB/frame)
clip_path = run.rclip

[mot]                         # v4 multi-target board (scenarios A-D), defaults shown
enabled = true
n_init = 3                    # hits to confirm a track
occl_s = 0.5                  # short vs long occlusion: OCCLUDED longer than this -> LOST
lost_keep_s = 3.0             # LOST tracks kept for colour re-identification
q_px = 200000                 # CV process noise [px^2/s^3] (hand-held)
amb_hist_margin = 0.25        # after two tracks separate: colour distance below this -> AMBIGUOUS
amb_hold_s = 1.0
reid_hist = 0.35              # max colour distance to re-identify a LOST track
w_center = 0.35               # priority weights (sum 1)
w_size = 0.20
w_approach = 0.10
w_conf = 0.20
w_age = 0.15
switch_margin = 0.15          # hysteresis: challenger must be 15 % better ...
switch_s = 0.3                # ... for 0.3 s, and the current target held >= hold_s
hold_s = 1.0
scan_period = 30              # whole-frame scan every N frames while tracking (0 = off)

[quality]                     # v4 image quality gate (scenario G)
enabled = true
dark_luma = 28                # mean lores luma below -> DARK
sat_frac = 0.35               # saturated fraction above -> GLARE (backlight)
blur_ratio = 0.35             # target sharpness below this x baseline -> BLUR

[aim]                         # v4 aim output gate (scenarios I, J)
coast_follow_s = 0.15         # follow the prediction this long after the last measurement, then HOLD
