; RCWS Stage 1 — STM32 NUCLEO-F401RE 500 Hz visual-servoing firmware
[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200

; Cortex-M4F hardware FPU
build_flags = -mfpu=fpv4-sp-d16 -mfloat-abi=hard -O2 -Wall

; build_flags only reach the compiler; the linker must use the same float ABI
; (otherwise: "uses VFP register arguments, output does not").
extra_scripts = post:scripts/fpu_link_flags.py
